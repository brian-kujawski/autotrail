[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "autotrail"
version = "0.0.1"
description = "Suggest hash trails from OpenStreetMap data and simulate a pack of hounds running them."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "folium>=0.16",
    "gpxpy>=1.6",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autotrail = "autotrail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
